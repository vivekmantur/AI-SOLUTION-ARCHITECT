name: ai-architect
services:
  ai-solution-architect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-solution-architect
    ports:
      - "8602:8602"
    environment:
      - PYTHONUNBUFFERED=1
      - REACT_APP_API_URL=
    volumes:
      # Mount patterns directory for easy updates without rebuild
      - ./patterns:/app/patterns:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8602/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: ai-architect-network
